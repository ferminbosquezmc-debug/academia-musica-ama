<text x="1340" y="546" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#5F6368" text-anchor="start" >sin encorvarme sobre la batería</text>
<circle cx="1290" cy="625" r="30" fill="#C9A227" stroke="#1A1A1A" stroke-width="2.5"/>
<text x="1290" y="636.4" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="33" font-weight="700" fill="#1A1A1A" text-anchor="middle" >4</text>
<text x="1340" y="629" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1A1A" text-anchor="start" >Pie derecho en el bombo, pie izquierdo en el hi-hat</text>
<text x="1340" y="671" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#5F6368" text-anchor="start" >los dos pies sobre sus pedales</text>
<circle cx="1290" cy="750" r="30" fill="#C9A227" stroke="#1A1A1A" stroke-width="2.5"/>
