<text x="1340" y="254" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1A1A" text-anchor="start" >Muslos casi paralelos al suelo</text>
<text x="1340" y="296" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#5F6368" text-anchor="start" >rodillas un poco más bajas que la cadera</text>
