<text x="1340" y="754" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1A1A" text-anchor="start" >El redoblante entre las rodillas</text>
<text x="1340" y="796" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#5F6368" text-anchor="start" >un poco arriba de las piernas, plano</text>
<circle cx="1290" cy="875" r="30" fill="#C9A227" stroke="#1A1A1A" stroke-width="2.5"/>
<text x="1290" y="886.4" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="33" font-weight="700" fill="#1A1A1A" text-anchor="middle" >6</text>
<text x="1340" y="879" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1A1A" text-anchor="start" >Brazos relajados</text>
<text x="1340" y="921" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#5F6368" text-anchor="start" >codos cerca del cuerpo</text>
<circle cx="1290" cy="1000" r="30" fill="#C9A227" stroke="#1A1A1A" stroke-width="2.5"/>
<text x="1290" y="1011.4" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="33" font-weight="700" fill="#1A1A1A" text-anchor="middle" >7</text>
<text x="1340" y="1004" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1A1A" text-anchor="start" >Todo al alcance de la mano</text>
<text x="1340" y="1046" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#5F6368" text-anchor="start" >no me estiro para llegar a un tom o un platillo</text>
