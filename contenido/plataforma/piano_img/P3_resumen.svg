<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1010" viewBox="0 0 1000 1010" role="img" aria-label="Lo que aprendí en los tres niveles de piano"><title>Lo que aprendí en los tres niveles de piano</title><rect width="1000" height="1010" rx="26" fill="#0b0907"/><rect x="20" y="20" width="470" height="310" rx="18" fill="#15110c" stroke="#4a3f2c" stroke-width="2.5"/><text x="46" y="70" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#f2b93b">Escalas mayores</text><text x="46" y="120" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#fbf7ef">• Do · sin alteraciones</text><text x="46" y="168" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#fbf7ef">• Sol · FA♯</text><text x="46" y="216" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#fbf7ef">• Re · FA♯ DO♯</text><text x="46" y="264" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#fbf7ef">• La · FA♯ DO♯ SOL♯</text><text x="46" y="312" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#fbf7ef">• Fa · SI♭</text><rect x="510" y="20" width="470" height="310" rx="18" fill="#15110c" stroke="#4a3f2c" stroke-width="2.5"/><text x="536" y="70" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#f2b93b">Escalas menores</text><text x="536" y="120" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#fbf7ef">• La menor · sin alteraciones</text><text x="536" y="168" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#fbf7ef">• Mi menor · FA♯</text><text x="536" y="216" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#fbf7ef">• Pentatónica de La menor</text><text x="536" y="264" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#fbf7ef">• Escala cromática</text><rect x="20" y="350" width="470" height="310" rx="18" fill="#15110c" stroke="#4a3f2c" stroke-width="2.5"/><text x="46" y="400" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#f2b93b">Acordes</text><text x="46" y="450" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#fbf7ef">• Mayores: C D E F G A</text><text x="46" y="498" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#fbf7ef">• Menores: Am Dm Em Cm</text><text x="46" y="546" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#fbf7ef">• Disminuido: B°</text><text x="46" y="594" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#fbf7ef">• Séptimas: G7 D7 C7</text><rect x="510" y="350" width="470" height="310" rx="18" fill="#15110c" stroke="#4a3f2c" stroke-width="2.5"/><text x="536" y="400" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#f2b93b">Armonía</text><text x="536" y="450" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#fbf7ef">• Inversiones: C · C/E · C/G</text><text x="536" y="498" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#fbf7ef">• I – IV – V7 – I</text><text x="536" y="546" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#fbf7ef">• I – V – vi – IV</text><text x="536" y="594" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#fbf7ef">• Cadencia V7 → I</text><rect x="20" y="680" width="470" height="310" rx="18" fill="#15110c" stroke="#4a3f2c" stroke-width="2.5"/><text x="46" y="730" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#f2b93b">Técnica</text><text x="46" y="780" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#fbf7ef">• Manos juntas: contrario y paralelo</text><text x="46" y="828" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#fbf7ef">• Legato y staccato</text><text x="46" y="876" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#fbf7ef">• Pedal sincopado</text><text x="46" y="924" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#fbf7ef">• Caída y elevación</text><rect x="510" y="680" width="470" height="310" rx="18" fill="#15110c" stroke="#4a3f2c" stroke-width="2.5"/><text x="536" y="730" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#f2b93b">Música</text><text x="536" y="780" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#fbf7ef">• Lectura en dos claves</text><text x="536" y="828" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#fbf7ef">• Estilos: balada, pop, vals, caribeño</text><text x="536" y="876" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#fbf7ef">• Transporte y armonización</text><text x="536" y="924" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="23" font-weight="600" fill="#fbf7ef">• Improvisación</text></svg>