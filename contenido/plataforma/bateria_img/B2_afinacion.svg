<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="666" viewBox="0 0 1000 666" role="img" aria-label="Afinación en estrella y toms escalonados"><title>Afinación en estrella y toms escalonados</title><rect width="1000" height="666" rx="26" fill="#0b0907"/><circle cx="250" cy="250" r="202" fill="#4a3f2c"/><circle cx="250" cy="250" r="176" fill="#efe6d2"/><path d="M250,60L250,440L440,250L60,250L384.4,115.6L115.6,384.4L384.4,384.4L115.6,115.6Z" fill="none" stroke="#E5312B" stroke-width="4" stroke-linejoin="round" opacity=".85"/><circle cx="250" cy="60" r="30" fill="#0b0907" stroke="#f2b93b" stroke-width="4"/><text x="250" y="72" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#f2b93b">1</text><circle cx="250" cy="440" r="30" fill="#0b0907" stroke="#f2b93b" stroke-width="4"/><text x="250" y="452" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#f2b93b">2</text><circle cx="440" cy="250" r="30" fill="#0b0907" stroke="#f2b93b" stroke-width="4"/><text x="440" y="262" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#f2b93b">3</text><circle cx="60" cy="250" r="30" fill="#0b0907" stroke="#f2b93b" stroke-width="4"/><text x="60" y="262" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#f2b93b">4</text><circle cx="384.4" cy="115.6" r="30" fill="#0b0907" stroke="#f2b93b" stroke-width="4"/><text x="384.4" y="127.6" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#f2b93b">5</text><circle cx="115.6" cy="384.4" r="30" fill="#0b0907" stroke="#f2b93b" stroke-width="4"/><text x="115.6" y="396.4" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#f2b93b">6</text><circle cx="384.4" cy="384.4" r="30" fill="#0b0907" stroke="#f2b93b" stroke-width="4"/><text x="384.4" y="396.4" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#f2b93b">7</text><circle cx="115.6" cy="115.6" r="30" fill="#0b0907" stroke="#f2b93b" stroke-width="4"/><text x="115.6" y="127.6" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#f2b93b">8</text><text x="250" y="510" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#f2b93b">Tornillo por tornillo, en este orden</text><text x="250" y="544" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#b3aa98">¼ de vuelta cada vez</text><circle cx="585" cy="150" r="60" fill="#4a3f2c"/><circle cx="585" cy="150" r="52" fill="#efe6d2"/><text x="585" y="242" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#fbf7ef">Tom 1</text><text x="585" y="272" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#f2b93b">más agudo</text><circle cx="740" cy="240" r="74" fill="#4a3f2c"/><circle cx="740" cy="240" r="66" fill="#efe6d2"/><text x="740" y="346" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#fbf7ef">Tom 2</text><text x="740" y="376" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#b3aa98">medio</text><circle cx="895" cy="340" r="90" fill="#4a3f2c"/><circle cx="895" cy="340" r="82" fill="#efe6d2"/><text x="895" y="462" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#fbf7ef">Tom de piso</text><text x="895" y="492" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#7cc7ef">más grave</text><path d="M560,92 L960,92" stroke="none"/><text x="745" y="60" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#f2b93b">De agudo a grave, como una escalera</text><text x="500" y="600" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#b3aa98">Más tensión = más agudo · menos tensión = más grave</text><text x="500" y="636" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#b3aa98">La distancia entre toms es a gusto (suele ser una 3.ª o 4.ª, aproximadamente)</text></svg>