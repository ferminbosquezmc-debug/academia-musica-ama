<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-label="Programa de la presentación final"><title>Programa de la presentación final</title><rect width="1000" height="590" rx="26" fill="#0b0907"/><text x="30" y="44" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#f2b93b">El programa de mi concierto</text><rect x="20" y="66" width="472" height="200" rx="18" fill="#15110c" stroke="#2AA7E8" stroke-width="3"/><text x="44" y="108" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#2AA7E8">1</text><text x="44" y="156" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#fff">Rudimentos</text><text x="44" y="198" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#b3aa98">paradiddle, redoble de 5</text><text x="44" y="230" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#b3aa98">y flam, de lento a rápido</text><rect x="508" y="66" width="472" height="200" rx="18" fill="#15110c" stroke="#2E9E4F" stroke-width="3"/><text x="532" y="108" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#2E9E4F">2</text><text x="532" y="156" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#fff">Tres estilos</text><text x="532" y="198" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#b3aa98">funk, reggae, ska, dembow,</text><text x="532" y="230" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#b3aa98">cumbia o bossa nova</text><rect x="20" y="282" width="472" height="200" rx="18" fill="#15110c" stroke="#F57C00" stroke-width="3"/><text x="44" y="324" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#F57C00">3</text><text x="44" y="372" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#fff">Canción con banda</text><text x="44" y="414" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#b3aa98">leo el chart y sigo las</text><text x="44" y="446" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#b3aa98">señales del director</text><rect x="508" y="282" width="472" height="200" rx="18" fill="#15110c" stroke="#E5312B" stroke-width="3"/><text x="532" y="324" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#E5312B">4</text><text x="532" y="372" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#fff">Mi solo</text><text x="532" y="414" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#b3aa98">idea, repetición, subida</text><text x="532" y="446" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#b3aa98">y final con crash y bombo</text><text x="500" y="524" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#f2b93b">Antes: afino, monto el kit y respiro</text><text x="500" y="560" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#b3aa98">Después: saludo, agradezco y recojo mi equipo</text></svg>