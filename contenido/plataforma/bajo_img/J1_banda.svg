<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="890" viewBox="0 0 1000 890" role="img" aria-label="El bajo en la banda"><title>El bajo en la banda</title><rect width="1000" height="890" rx="26" fill="#0b0907"/><text x="500" y="70" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-size="50" font-weight="700" fill="#fbf7ef">El bajo: el puente de la banda</text><rect x="150" y="120" width="700" height="140" rx="22" fill="#E5312B"/><text x="500" y="186" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="46" font-weight="700" fill="#fff">Batería</text><text x="500" y="232" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="28" font-weight="600" fill="#fff">el ritmo y el pulso</text><text x="500" y="306" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="54" font-weight="700" fill="#b3aa98">⇅</text><rect x="150" y="320" width="700" height="140" rx="22" fill="#f2b93b"/><text x="500" y="386" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="46" font-weight="700" fill="#1b1206">Bajo</text><text x="500" y="432" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="28" font-weight="600" fill="#1b1206">notas graves con ritmo</text><text x="500" y="506" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="54" font-weight="700" fill="#b3aa98">⇅</text><rect x="150" y="520" width="700" height="140" rx="22" fill="#2AA7E8"/><text x="500" y="586" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="46" font-weight="700" fill="#1A1A1A">Piano y guitarra</text><text x="500" y="632" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="28" font-weight="600" fill="#1A1A1A">los acordes (armonía)</text><text x="500" y="760" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="28" font-weight="600" fill="#fbf7ef">El bajo toca con el bombo (ritmo)</text><text x="500" y="800" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="28" font-weight="600" fill="#fbf7ef">y sobre la nota principal del acorde (armonía).</text><text x="500" y="856" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#f2b93b">Si el bajo se detiene, la banda «pierde el piso».</text></svg>