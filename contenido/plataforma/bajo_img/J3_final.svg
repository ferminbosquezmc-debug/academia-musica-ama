<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="840" viewBox="0 0 1000 840" role="img" aria-label="Programa de la presentación final de bajo"><title>Programa de la presentación final de bajo</title><rect width="1000" height="840" rx="26" fill="#0b0907"/><text x="500" y="58" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-size="44" font-weight="700" fill="#fbf7ef">¡Presentación final! · Bajo</text><text x="500" y="100" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#b3aa98">El programa de mi concierto · Nivel 3</text><rect x="30" y="140" width="460" height="280" rx="22" fill="#2AA7E8"/><circle cx="260" cy="210" r="42" fill="#fff"/><text x="260" y="228" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="46" font-weight="700" fill="#1A1A1A">1</text><text x="260" y="310" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#1A1A1A">Escalas</text><text x="260" y="360" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#1A1A1A">los 5 patrones y la pentatónica</text><rect x="510" y="140" width="460" height="280" rx="22" fill="#2E9E4F"/><circle cx="740" cy="210" r="42" fill="#fff"/><text x="740" y="228" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="46" font-weight="700" fill="#1A1A1A">2</text><text x="740" y="310" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">Tres estilos</text><text x="740" y="360" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#fff">balada, rock, cumbia o reggae</text><rect x="30" y="440" width="460" height="280" rx="22" fill="#F57C00"/><circle cx="260" cy="510" r="42" fill="#fff"/><text x="260" y="528" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="46" font-weight="700" fill="#1A1A1A">3</text><text x="260" y="610" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#1A1A1A">Canción con banda</text><text x="260" y="660" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#1A1A1A">leo el chart y sigo las señales</text><rect x="510" y="440" width="460" height="280" rx="22" fill="#E5312B"/><circle cx="740" cy="510" r="42" fill="#fff"/><text x="740" y="528" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="46" font-weight="700" fill="#1A1A1A">4</text><text x="740" y="610" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#fff">Groove de slap</text><text x="740" y="660" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#fff">mi groove de funk con slap</text><text x="500" y="770" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#fbf7ef">Antes: afino, reviso cables y amplificador.</text><text x="500" y="806" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#fbf7ef">Después: saludo, agradezco y guardo mi equipo.</text></svg>