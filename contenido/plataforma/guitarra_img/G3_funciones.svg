<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="920" viewBox="0 0 1000 920" role="img" aria-label="La familia de los acordes: funciones y cadencias"><title>La familia de los acordes: funciones y cadencias</title><rect width="1000" height="920" rx="26" fill="#0b0907"/><rect x="20" y="20" width="310" height="330" rx="18" fill="#15110c" stroke="#4a3f2c" stroke-width="2.5"/><circle cx="175" cy="90" r="44" fill="#2E9E4F" stroke="#1b1206" stroke-width="3"/><text x="175" y="106.7" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="46" font-weight="700" fill="#111">T</text><text x="175" y="180" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#fbf7ef">Tónica</text><text x="175" y="214" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#f2b93b">reposo</text><text x="175" y="268" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-size="32" font-weight="700" fill="#fbf7ef">I · vi · iii</text><text x="175" y="312" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#b3aa98">en Do: C · Am · Em</text><rect x="345" y="20" width="310" height="330" rx="18" fill="#15110c" stroke="#4a3f2c" stroke-width="2.5"/><circle cx="500" cy="90" r="44" fill="#2AA7E8" stroke="#1b1206" stroke-width="3"/><text x="500" y="106.7" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="46" font-weight="700" fill="#111">S</text><text x="500" y="180" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#fbf7ef">Subdominante</text><text x="500" y="214" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#f2b93b">alejamiento</text><text x="500" y="268" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-size="32" font-weight="700" fill="#fbf7ef">IV · ii</text><text x="500" y="312" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#b3aa98">en Do: F · Dm</text><rect x="670" y="20" width="310" height="330" rx="18" fill="#15110c" stroke="#4a3f2c" stroke-width="2.5"/><circle cx="825" cy="90" r="44" fill="#E5312B" stroke="#1b1206" stroke-width="3"/><text x="825" y="106.7" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="46" font-weight="700" fill="#fff">D</text><text x="825" y="180" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#fbf7ef">Dominante</text><text x="825" y="214" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#f2b93b">tensión</text><text x="825" y="268" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-size="32" font-weight="700" fill="#fbf7ef">V · V7 · vii°</text><text x="825" y="312" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#b3aa98">en Do: G · G7 · B°</text><text x="30" y="410" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#f2b93b">Cadencias</text><rect x="20" y="440" width="470" height="210" rx="18" fill="#15110c" stroke="#4a3f2c" stroke-width="2.5"/><text x="255" y="490" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#f2b93b">Auténtica</text><text x="255" y="546" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-size="40" font-weight="700" fill="#fbf7ef">V → I</text><text x="255" y="588" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#fbf7ef">G7 → C</text><text x="255" y="626" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#b3aa98">final fuerte, como un punto</text><rect x="510" y="440" width="470" height="210" rx="18" fill="#15110c" stroke="#4a3f2c" stroke-width="2.5"/><text x="745" y="490" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#f2b93b">Plagal</text><text x="745" y="546" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-size="40" font-weight="700" fill="#fbf7ef">IV → I</text><text x="745" y="588" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#fbf7ef">F → C</text><text x="745" y="626" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#b3aa98">final suave, «amén»</text><rect x="20" y="670" width="470" height="210" rx="18" fill="#15110c" stroke="#4a3f2c" stroke-width="2.5"/><text x="255" y="720" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#f2b93b">Semicadencia</text><text x="255" y="776" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-size="40" font-weight="700" fill="#fbf7ef">… → V</text><text x="255" y="818" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#fbf7ef">C → G</text><text x="255" y="856" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#b3aa98">en suspenso, como una coma</text><rect x="510" y="670" width="470" height="210" rx="18" fill="#15110c" stroke="#4a3f2c" stroke-width="2.5"/><text x="745" y="720" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#f2b93b">Rota</text><text x="745" y="776" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-size="40" font-weight="700" fill="#fbf7ef">V → vi</text><text x="745" y="818" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#fbf7ef">G7 → Am</text><text x="745" y="856" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#b3aa98">sorpresa: no llega a casa</text></svg>