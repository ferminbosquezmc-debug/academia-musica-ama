<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-label="Mi presentación final en cuatro partes"><title>Mi presentación final en cuatro partes</title><rect width="1000" height="640" rx="26" fill="#0b0907"/><rect x="20" y="20" width="470" height="250" rx="18" fill="#15110c" stroke="#4a3f2c" stroke-width="2.5"/><circle cx="255" cy="90" r="44" fill="#2AA7E8" stroke="#1b1206" stroke-width="3"/><text x="255" y="106.7" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="46" font-weight="700" fill="#111">1</text><text x="255" y="180" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="38" font-weight="700" fill="#fbf7ef">Escala</text><text x="255" y="230" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="24" font-weight="500" fill="#b3aa98">mayor móvil o pentatónica</text><rect x="510" y="20" width="470" height="250" rx="18" fill="#15110c" stroke="#4a3f2c" stroke-width="2.5"/><circle cx="745" cy="90" r="44" fill="#2E9E4F" stroke="#1b1206" stroke-width="3"/><text x="745" y="106.7" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="46" font-weight="700" fill="#fff">2</text><text x="745" y="180" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="38" font-weight="700" fill="#fbf7ef">Obra</text><text x="745" y="230" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="24" font-weight="500" fill="#b3aa98">Estudio en Do (al estilo de Sor)</text><rect x="20" y="290" width="470" height="250" rx="18" fill="#15110c" stroke="#4a3f2c" stroke-width="2.5"/><circle cx="255" cy="360" r="44" fill="#F57C00" stroke="#1b1206" stroke-width="3"/><text x="255" y="376.7" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="46" font-weight="700" fill="#111">3</text><text x="255" y="450" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="38" font-weight="700" fill="#fbf7ef">Canción</text><text x="255" y="500" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="24" font-weight="500" fill="#b3aa98">acompaño a un cantante o en dúo</text><rect x="510" y="290" width="470" height="250" rx="18" fill="#15110c" stroke="#4a3f2c" stroke-width="2.5"/><circle cx="745" cy="360" r="44" fill="#8E3BB8" stroke="#1b1206" stroke-width="3"/><text x="745" y="376.7" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="46" font-weight="700" fill="#fff">4</text><text x="745" y="450" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="38" font-weight="700" fill="#fbf7ef">Improvisación</text><text x="745" y="500" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="24" font-weight="500" fill="#b3aa98">blues en La o Am – F – G – Am</text><text x="500" y="600" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="28" font-weight="600" fill="#f2b93b">Entro, saludo, afino, toco, agradezco y salgo</text></svg>