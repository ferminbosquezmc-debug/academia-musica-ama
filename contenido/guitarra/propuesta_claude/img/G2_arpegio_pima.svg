<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="770" viewBox="0 0 2400 770" role="img" aria-label="El arpegio p – i – m – a">
<title>El arpegio p – i – m – a</title>
<rect width="2400" height="770" fill="#FFFFFF"/><text x="40" y="70" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="46" font-weight="700" fill="#1A1A1A" text-anchor="start">El arpegio p – i – m – a</text><text x="40" y="118" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="500" fill="#5F6368" text-anchor="start">Cada dedo de la mano derecha tiene su cuerda</text><rect x="40" y="160" width="753.3333333333334" height="260" rx="24" fill="#F9D9D7" stroke="#1A1A1A" stroke-width="3"/><text x="416.6666666666667" y="230" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="700" fill="#1A1A1A" text-anchor="middle">p · pulgar</text><text x="416.6666666666667" y="290" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">El bajo del acorde</text><text x="416.6666666666667" y="336" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">cuerdas 6, 5 o 4</text><rect x="823.3333333333334" y="160" width="753.3333333333334" height="260" rx="24" fill="#DCEFE0" stroke="#1A1A1A" stroke-width="3"/><text x="1200" y="230" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="700" fill="#1A1A1A" text-anchor="middle">i · índice</text><text x="1200" y="290" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">3.ª cuerda</text><rect x="1606.6666666666667" y="160" width="753.3333333333334" height="260" rx="24" fill="#DCEBF7" stroke="#1A1A1A" stroke-width="3"/><text x="1983.3333333333335" y="230" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="700" fill="#1A1A1A" text-anchor="middle">m · medio</text><text x="1983.3333333333335" y="290" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">2.ª cuerda</text><rect x="40" y="450" width="753.3333333333334" height="260" rx="24" fill="#FBF1D3" stroke="#1A1A1A" stroke-width="3"/><text x="416.6666666666667" y="520" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="700" fill="#1A1A1A" text-anchor="middle">a · anular</text><text x="416.6666666666667" y="580" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">1.ª cuerda</text><rect x="823.3333333333334" y="450" width="753.3333333333334" height="260" rx="24" fill="#F4EFE3" stroke="#1A1A1A" stroke-width="3"/><text x="1200" y="520" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="700" fill="#1A1A1A" text-anchor="middle">En 4/4</text><text x="1200" y="580" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">p – i – m – a – m – i</text><text x="1200" y="626" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">(corcheas)</text><rect x="1606.6666666666667" y="450" width="753.3333333333334" height="260" rx="24" fill="#F4EFE3" stroke="#1A1A1A" stroke-width="3"/><text x="1983.3333333333335" y="520" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="700" fill="#1A1A1A" text-anchor="middle">En 3/4</text><text x="1983.3333333333335" y="580" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">p – i – m – a – m – i</text><text x="1983.3333333333335" y="626" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">un acorde por compás</text>
</svg>
