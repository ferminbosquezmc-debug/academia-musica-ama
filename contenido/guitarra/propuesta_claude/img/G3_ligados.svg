<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="520" viewBox="0 0 2400 520" role="img" aria-label="Ligados: dos notas con un solo golpe">
<title>Ligados: dos notas con un solo golpe</title>
<rect width="2400" height="520" fill="#FFFFFF"/><text x="40" y="70" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="46" font-weight="700" fill="#1A1A1A" text-anchor="start">Ligados: dos notas con un solo golpe</text><text x="40" y="118" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="500" fill="#5F6368" text-anchor="start">La mano derecha toca la primera nota; la izquierda hace la segunda</text><rect x="40" y="160" width="753.3333333333334" height="300" rx="24" fill="#DCEFE0" stroke="#1A1A1A" stroke-width="3"/><text x="416.6666666666667" y="230" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="700" fill="#1A1A1A" text-anchor="middle">Ascendente (H)</text><text x="416.6666666666667" y="290" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">toco la nota de abajo y</text><text x="416.6666666666667" y="336" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">«martillo» el dedo encima</text><text x="416.6666666666667" y="382" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">hammer-on</text><rect x="823.3333333333334" y="160" width="753.3333333333334" height="300" rx="24" fill="#DCEBF7" stroke="#1A1A1A" stroke-width="3"/><text x="1200" y="230" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="700" fill="#1A1A1A" text-anchor="middle">Descendente (P)</text><text x="1200" y="290" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">con los dos dedos puestos,</text><text x="1200" y="336" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">tiro del dedo de arriba</text><text x="1200" y="382" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">pull-off</text><rect x="1606.6666666666667" y="160" width="753.3333333333334" height="300" rx="24" fill="#FBF1D3" stroke="#1A1A1A" stroke-width="3"/><text x="1983.3333333333335" y="230" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="700" fill="#1A1A1A" text-anchor="middle">Staccato</text><text x="1983.3333333333335" y="290" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">nota corta:</text><text x="1983.3333333333335" y="336" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">apago la cuerda con</text><text x="1983.3333333333335" y="382" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">la palma o aflojando</text>
</svg>
