1="322" x2="2320" y2="322" stroke="#4E453D" stroke-width="2.9"/><text x="70" y="333" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="30" font-weight="700" fill="#5F6368" text-anchor="end">2ª</text><text x="150" y="333" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="26" font-weight="600" fill="#5F6368" text-anchor="end">SI</text><line x1="246" y1="414" x2="2320" y2="414" stroke="#4E453D" stroke-width="3.8"/><text x="70" y="425" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="30" font-weight="700" fill="#5F6368" text-anchor="end">3ª</text><text x="150" y="425" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="26" font-weight="600" fill="#5F6368" text-anchor="end">SOL</text><line x1="246" y1="506" x2="2320" y2="506" stroke="#4E453D" stroke-width="4.7"/><text x="70" y="517" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="30" font-weight="700" fill="#5F6368" text-anchor="end">4ª</text><text x="150" y="517" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="26" font-weight="600" fill="#5F6368" text-anchor="end">RE</text><line x1="246" y1="598" x2="2320" y2="598" stroke="#4E453D" stroke-width="5.6"/><text x="70" y="609" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="30" font-weight="700" fill="#5F6368" text-anchor="end">5ª</text><text x="150" y="609" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="26" font-weight="600" fill="#5F6368" text-anchor="end">LA</text><line x1="246" y1="690" x2="2320" y2="690" stroke="#4E453D" stroke-width="6.5"/><text x="70" y="701" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="30" font-weight="700" fill="#5F6368" text-anchor="end">6ª</text><text x="150" y="701" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="26" font-weight="600" fi