<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="770" viewBox="0 0 2400 770" role="img" aria-label="Cómo hacer la cejilla sin dolor">
<title>Cómo hacer la cejilla sin dolor</title>
<rect width="2400" height="770" fill="#FFFFFF"/><text x="40" y="70" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="46" font-weight="700" fill="#1A1A1A" text-anchor="start">Cómo hacer la cejilla sin dolor</text><text x="40" y="118" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="500" fill="#5F6368" text-anchor="start">Pocas veces y bien: la fuerza viene del brazo, no de apretar</text><rect x="40" y="160" width="753.3333333333334" height="260" rx="24" fill="#F4EFE3" stroke="#1A1A1A" stroke-width="3"/><text x="416.6666666666667" y="230" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="700" fill="#1A1A1A" text-anchor="middle">1 · El índice</text><text x="416.6666666666667" y="290" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">recto, sobre el canto</text><text x="416.6666666666667" y="336" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">cerca del traste</text><rect x="823.3333333333334" y="160" width="753.3333333333334" height="260" rx="24" fill="#F4EFE3" stroke="#1A1A1A" stroke-width="3"/><text x="1200" y="230" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="700" fill="#1A1A1A" text-anchor="middle">2 · El pulgar</text><text x="1200" y="290" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">detrás del mástil,</text><text x="1200" y="336" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">a la altura del dedo 2</text><rect x="1606.6666666666667" y="160" width="753.3333333333334" height="260" rx="24" fill="#F4EFE3" stroke="#1A1A1A" stroke-width="3"/><text x="1983.3333333333335" y="230" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="700" fill="#1A1A1A" text-anchor="middle">3 · El brazo</text><text x="1983.3333333333335" y="290" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">tira un poco hacia atrás</text><text x="1983.3333333333335" y="336" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">como si colgara</text><rect x="40" y="450" width="753.3333333333334" height="260" rx="24" fill="#F4EFE3" stroke="#1A1A1A" stroke-width="3"/><text x="416.6666666666667" y="520" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="700" fill="#1A1A1A" text-anchor="middle">4 · Prueba</text><text x="416.6666666666667" y="580" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">cuerda por cuerda:</text><text x="416.6666666666667" y="626" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">¿suena cada una?</text><rect x="823.3333333333334" y="450" width="753.3333333333334" height="260" rx="24" fill="#F4EFE3" stroke="#1A1A1A" stroke-width="3"/><text x="1200" y="520" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="700" fill="#1A1A1A" text-anchor="middle">5 · Descansa</text><text x="1200" y="580" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">10 segundos con cejilla,</text><text x="1200" y="626" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">10 segundos sin ella</text><rect x="1606.6666666666667" y="450" width="753.3333333333334" height="260" rx="24" fill="#F9D9D7" stroke="#1A1A1A" stroke-width="3"/><text x="1983.3333333333335" y="520" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="700" fill="#1A1A1A" text-anchor="middle">Si duele</text><text x="1983.3333333333335" y="580" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">para, sacude la mano</text><text x="1983.3333333333335" y="626" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">y vuelve a empezar</text>
</svg>
