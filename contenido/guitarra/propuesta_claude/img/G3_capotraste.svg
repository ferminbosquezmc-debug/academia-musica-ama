<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="770" viewBox="0 0 2400 770" role="img" aria-label="El capotraste: transportar sin cambiar los acordes">
<title>El capotraste: transportar sin cambiar los acordes</title>
<rect width="2400" height="770" fill="#FFFFFF"/><text x="40" y="70" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="46" font-weight="700" fill="#1A1A1A" text-anchor="start">El capotraste: transportar sin cambiar los acordes</text><text x="40" y="118" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="500" fill="#5F6368" text-anchor="start">Las formas que ya sabes, en otra tonalidad</text><rect x="40" y="160" width="753.3333333333334" height="260" rx="24" fill="#F4EFE3" stroke="#1A1A1A" stroke-width="3"/><text x="416.6666666666667" y="230" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="700" fill="#1A1A1A" text-anchor="middle">Capo en 2</text><text x="416.6666666666667" y="290" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">forma G → suena A</text><text x="416.6666666666667" y="336" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">forma C → suena D</text><rect x="823.3333333333334" y="160" width="753.3333333333334" height="260" rx="24" fill="#F4EFE3" stroke="#1A1A1A" stroke-width="3"/><text x="1200" y="230" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="700" fill="#1A1A1A" text-anchor="middle">Capo en 3</text><text x="1200" y="290" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">forma G → suena B♭</text><text x="1200" y="336" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">forma Em → suena Gm</text><rect x="1606.6666666666667" y="160" width="753.3333333333334" height="260" rx="24" fill="#F4EFE3" stroke="#1A1A1A" stroke-width="3"/><text x="1983.3333333333335" y="230" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="700" fill="#1A1A1A" text-anchor="middle">Capo en 5</text><text x="1983.3333333333335" y="290" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">forma C → suena F</text><text x="1983.3333333333335" y="336" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">forma G → suena C</text><rect x="40" y="450" width="753.3333333333334" height="260" rx="24" fill="#FBF1D3" stroke="#1A1A1A" stroke-width="3"/><text x="416.6666666666667" y="520" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="700" fill="#1A1A1A" text-anchor="middle">La regla</text><text x="416.6666666666667" y="580" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">cada traste sube</text><text x="416.6666666666667" y="626" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">medio tono</text><rect x="823.3333333333334" y="450" width="753.3333333333334" height="260" rx="24" fill="#DCEFE0" stroke="#1A1A1A" stroke-width="3"/><text x="1200" y="520" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="700" fill="#1A1A1A" text-anchor="middle">Para el cantante</text><text x="1200" y="580" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">busca su tono</text><text x="1200" y="626" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">y mueve el capo</text><rect x="1606.6666666666667" y="450" width="753.3333333333334" height="260" rx="24" fill="#F9D9D7" stroke="#1A1A1A" stroke-width="3"/><text x="1983.3333333333335" y="520" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="700" fill="#1A1A1A" text-anchor="middle">Cuidado</text><text x="1983.3333333333335" y="580" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">ponlo justo detrás</text><text x="1983.3333333333335" y="626" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">del traste, recto</text>
</svg>
