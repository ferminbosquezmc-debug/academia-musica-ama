<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="770" viewBox="0 0 2400 770" role="img" aria-label="La guitarra en el grupo">
<title>La guitarra en el grupo</title>
<rect width="2400" height="770" fill="#FFFFFF"/><text x="40" y="70" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="46" font-weight="700" fill="#1A1A1A" text-anchor="start">La guitarra en el grupo</text><text x="40" y="118" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="500" fill="#5F6368" text-anchor="start">Cada uno en su lugar: así el grupo suena claro</text><rect x="40" y="160" width="753.3333333333334" height="260" rx="24" fill="#DCEBF7" stroke="#1A1A1A" stroke-width="3"/><text x="416.6666666666667" y="230" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="700" fill="#1A1A1A" text-anchor="middle">Guitarra 1 · ritmo</text><text x="416.6666666666667" y="290" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">acordes con rasgueo</text><text x="416.6666666666667" y="336" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">sostiene el pulso</text><rect x="823.3333333333334" y="160" width="753.3333333333334" height="260" rx="24" fill="#DCEFE0" stroke="#1A1A1A" stroke-width="3"/><text x="1200" y="230" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="700" fill="#1A1A1A" text-anchor="middle">Guitarra 2 · arpegio</text><text x="1200" y="290" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">arpegios o notas</text><text x="1200" y="336" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">en otra zona del mástil</text><rect x="1606.6666666666667" y="160" width="753.3333333333334" height="260" rx="24" fill="#FBF1D3" stroke="#1A1A1A" stroke-width="3"/><text x="1983.3333333333335" y="230" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="700" fill="#1A1A1A" text-anchor="middle">Con un cantante</text><text x="1983.3333333333335" y="290" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">toca más suave</text><text x="1983.3333333333335" y="336" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">en las estrofas</text><rect x="40" y="450" width="753.3333333333334" height="260" rx="24" fill="#F4EFE3" stroke="#1A1A1A" stroke-width="3"/><text x="416.6666666666667" y="520" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="700" fill="#1A1A1A" text-anchor="middle">Con la batería</text><text x="416.6666666666667" y="580" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">el acento de la guitarra</text><text x="416.6666666666667" y="626" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">con el redoblante</text><rect x="823.3333333333334" y="450" width="753.3333333333334" height="260" rx="24" fill="#F4EFE3" stroke="#1A1A1A" stroke-width="3"/><text x="1200" y="520" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="700" fill="#1A1A1A" text-anchor="middle">Con el bajo</text><text x="1200" y="580" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">el bajo toca la raíz:</text><text x="1200" y="626" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">no la dupliques abajo</text><rect x="1606.6666666666667" y="450" width="753.3333333333334" height="260" rx="24" fill="#F4EFE3" stroke="#1A1A1A" stroke-width="3"/><text x="1983.3333333333335" y="520" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="700" fill="#1A1A1A" text-anchor="middle">Con el teclado</text><text x="1983.3333333333335" y="580" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">uno arpegia,</text><text x="1983.3333333333335" y="626" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#1A1A1A" text-anchor="middle">el otro sostiene</text>
</svg>
