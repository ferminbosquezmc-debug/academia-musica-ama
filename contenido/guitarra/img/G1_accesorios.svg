<circle cx="212" cy="40" r="9" fill="#888"/></g></g>
<text x="1180" y="330" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" fill="#1B4F72" text-anchor="middle">Visto de lado, apretando el mástil</text>
<text x="1500" y="640" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="700" fill="#333" text-anchor="middle">Perilla</text>
<text x="1200" y="820" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" fill="#1A1A1A" text-anchor="middle">Aprieta todas las cuerdas a la vez</text>
<text x="1200" y="862" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" fill="#1A1A1A" text-anchor="middle">justo detrás de un traste</text>
<text x="1200" y="930" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#333" text-anchor="middle">Cada traste sube un semitono</text>
<text x="1200" y="975" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#333" text-anchor="middle">las formas de los acordes no cambian</text>
<text x="1200" y="1060" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" fill="#1B4F72" text-anchor="middle">Capo en el traste 2: SOL suena como LA</text>
<text x="1990" y="250" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="44" font-weight="700" fill="#5B2C6F" text-anchor="middle">3 · Correa</text>
