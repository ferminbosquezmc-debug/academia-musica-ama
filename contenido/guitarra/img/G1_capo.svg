<text x="1970" y="400" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#27AE60" text-anchor="middle">✓ Todas las cuerdas suenan claras</text>
<text x="410" y="880" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="700" fill="#1A1A1A" text-anchor="middle">Abro el capotraste</text>
<text x="410" y="928" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="500" fill="#333" text-anchor="middle">Giro la perilla para abrirlo.</text>
<text x="410" y="976" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="500" fill="#333" text-anchor="middle">(Si es de resorte, aprieto la pinza.)</text>
<text x="1190" y="880" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="700" fill="#1A1A1A" text-anchor="middle">Lo pongo justo detrás del traste</text>
<text x="1190" y="928" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="500" fill="#333" text-anchor="middle">cerca del traste, no encima de él,</text>
<text x="1190" y="976" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="500" fill="#333" text-anchor="middle">y bien recto, de lado a lado.</text>
<text x="1970" y="880" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="700" fill="#1A1A1A" text-anchor="middle">Cierro y pruebo</text>
<text x="1970" y="928" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="500" fill="#333" text-anchor="middle">Giro la perilla solo hasta que suene</text>
<text x="1970" y="976" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="500" fill="#333" text-anchor="middle">claro. Si una cuerda zumba, lo acerco.</text>
