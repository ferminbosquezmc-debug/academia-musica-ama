<text x="1156" y="466" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#555" text-anchor="start">traste</text>
<text x="1190" y="270" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="600" fill="#555" text-anchor="middle">Visto desde arriba</text>
