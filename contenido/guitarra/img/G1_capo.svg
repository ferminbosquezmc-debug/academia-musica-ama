<text x="860" y="770" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="500" fill="#666" text-anchor="start">← hacia la cabeza</text>
<text x="1520" y="770" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="500" fill="#666" text-anchor="end">hacia la caja →</text>
<rect x="1014" y="514" width="76" height="212" rx="12" fill="#27AE6033" stroke="#27AE60" stroke-width="6" stroke-dasharray="14 10"/>
<text x="1002" y="470" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#27AE60" text-anchor="end">aquí</text>
<rect x="1022" y="300" width="60" height="140" rx="22" fill="#2E86C1" stroke="#1B4F72" stroke-width="6"/>
<rect x="1040" y="240" width="24" height="70" rx="10" fill="#1B4F72"/>
<path d="M1052 450 L1052 500" stroke="#C0392B" stroke-width="6" marker-end="url(#ar)"/>
