<text x="1640" y="770" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="500" fill="#666" text-anchor="start">← hacia la cabeza</text>
<text x="2300" y="770" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="500" fill="#666" text-anchor="end">hacia la caja →</text>
<rect x="1802" y="500" width="60" height="240" rx="22" fill="#2E86C1" stroke="#1B4F72" stroke-width="6"/>
<rect x="1820" y="440" width="24" height="70" rx="10" fill="#1B4F72"/>
<text x="1970" y="420" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="700" fill="#27AE60" text-anchor="middle">✓ Todas las cuerdas suenan claras</text>
<text x="410" y="880" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="700" fill="#1A1A1A" text-anchor="middle">Abro la pinza</text>
<text x="410" y="928" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="500" fill="#333" text-anchor="middle">Aprieto los extremos con los dedos.</text>
<text x="410" y="976" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="500" fill="#333" text-anchor="middle">Fíjate en qué traste lo quieres.</text>
<text x="1190" y="880" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="700" fill="#1A1A1A" text-anchor="middle">Lo pongo justo detrás del traste</text>
<text x="1190" y="928" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="500" fill="#333" text-anchor="middle">cerca del traste, no encima de él,</text>
<text x="1190" y="976" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="500" fill="#333" text-anchor="middle">y bien recto, de lado a lado.</text>
<text x="1970" y="880" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="700" fill="#1A1A1A" text-anchor="middle">Suelto la pinza y pruebo</text>
<text x="1970" y="928" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="500" fill="#333" text-anchor="middle">Si una cuerda zumba, lo acerco</text>
<text x="1970" y="976" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="500" fill="#333" text-anchor="middle">un poco más al traste.</text>
</svg>