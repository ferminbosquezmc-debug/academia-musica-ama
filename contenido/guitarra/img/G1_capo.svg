<text x="40" y="72" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="48" font-weight="700" fill="#1A1A1A" text-anchor="start">Cómo pongo el capotraste</text>
<text x="40" y="124" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="500" fill="#555" text-anchor="start">Siempre justo detrás del traste, recto y apretando todas las cuerdas</text>
