<text x="1156" y="466" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="600" fill="#555" text-anchor="start">traste</text>
<rect x="1650" y="520" width="640" height="200" fill="#D4A373" stroke="#6E4B2A" stroke-width="6"/>
<rect x="1720" y="520" width="10" height="200" fill="#9AA3A8"/>
