<text x="2210" y="600" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#C0392B" text-anchor="middle">hombro izquierdo</text>
<text x="410" y="880" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="700" fill="#1A1A1A" text-anchor="middle">Engancho un extremo</text>
<text x="410" y="928" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="500" fill="#333" text-anchor="middle">en el botón de abajo de la caja.</text>
<text x="410" y="976" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="500" fill="#333" text-anchor="middle">Que entre bien hasta el fondo.</text>
<text x="1190" y="880" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="700" fill="#1A1A1A" text-anchor="middle">Engancho el otro extremo</text>
<text x="1190" y="928" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="500" fill="#333" text-anchor="middle">en el botón cerca del mástil.</text>
<text x="1190" y="976" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="500" fill="#333" text-anchor="middle">Reviso que los dos estén firmes.</text>
<text x="1970" y="880" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="700" fill="#1A1A1A" text-anchor="middle">Me la cuelgo y ajusto el largo</text>
<text x="1970" y="928" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="500" fill="#333" text-anchor="middle">La correa pasa por el hombro izquierdo.</text>
<text x="1970" y="976" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="500" fill="#333" text-anchor="middle">La guitarra, a la altura de sentado.</text>
</svg>