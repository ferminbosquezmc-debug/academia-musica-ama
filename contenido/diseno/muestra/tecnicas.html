<section>
 <h2>4 · Láminas técnicas redibujadas · Guitarra</h2>
 <p class="mute" style="margin-top:8px;max-width:62ch">Las mismas notas, números y textos de las láminas de hoy, con el estilo nuevo. Ahora son angostas: en el teléfono se ven completas, sin deslizar. Las explicaciones van como texto debajo de cada lámina.</p>
 <h3 class="tmes">Mes 1</h3>
 <div class="tec">
  <figure><img src="img_tec/G1_grados.svg" alt="Los 7 grados de la escala + la octava" loading="lazy"><figcaption><span class="ok">Clase 1</span><b>Los 7 grados de la escala + la octava</b><span>De DO grave (en la línea adicional de abajo) a DO agudo (3.er espacio). Cada nota lleva su grado, su nombre y su cifrado. El 1 y el 8 son la misma nota: una octava.</span></figcaption></figure>
  <figure><img src="img_tec/N1_pentagrama_basico.svg" alt="El pentagrama: 5 líneas y 4 espacios" loading="lazy"><figcaption><span class="ok">Clase 4</span><b>El pentagrama: 5 líneas y 4 espacios</b><span>Las líneas y los espacios se cuentan de abajo hacia arriba.</span></figcaption></figure>
  <figure><img src="img_tec/N1_cuerda1.svg" alt="MI, FA y SOL en la 1.ª cuerda" loading="lazy"><figcaption><span class="ok">Clase 4</span><b>MI, FA y SOL en la 1.ª cuerda</b><span>MI al aire (0), FA en el traste 1 con el dedo 1 y SOL en el traste 3 con el dedo 3. En la tablatura, la línea de arriba es la 1.ª cuerda.</span></figcaption></figure>
 </div>
 <h3 class="tmes">Mes 2</h3>
 <div class="tec">
  <figure><img src="img_tec/N1_ritmo_negras.svg" alt="Ritmo en negras" loading="lazy"><figcaption><span class="ok">Clase 5</span><b>Ritmo en negras</b><span>Una negra = un tiempo. Di «ta» en cada nota y lleva el pulso con el pie.</span></figcaption></figure>
  <figure><img src="img_tec/N1_figuras.svg" alt="Figuras musicales y silencios" loading="lazy"><figcaption><span class="ok">Clase 5</span><b>Figuras musicales y silencios</b><span>Cuánto dura cada figura, su silencio y la sílaba para leerla. Los cuadros dorados son los tiempos que ocupa.</span></figcaption></figure>
  <figure><img src="img_tec/N1_ritmo_figuras.svg" alt="Ritmo con redondas, blancas y negras" loading="lazy"><figcaption><span class="ok">Clase 5</span><b>Ritmo con redondas, blancas y negras</b><span>Alarga la sílaba mientras la nota sigue sonando: «taa-aa» dura dos tiempos.</span></figcaption></figure>
  <figure><img src="img_tec/N1_arana.svg" alt="Ejercicio 1-2-3-4" loading="lazy"><figcaption><span class="ok">Clase 5</span><b>Ejercicio 1-2-3-4</b><span>Un dedo por traste: dedo 1 en el traste 1, dedo 2 en el 2… Empieza en la 6.ª cuerda y sube hasta la 1.ª.</span></figcaption></figure>
  <figure><img src="img_tec/N1_ritmo_silencios.svg" alt="Ritmo con silencios" loading="lazy"><figcaption><span class="ok">Clase 6</span><b>Ritmo con silencios</b><span>En el silencio no se toca: di «sh» y sigue contando el tiempo.</span></figcaption></figure>
  <figure><img src="img_tec/N1_compases.svg" alt="Compases de 2/4, 3/4 y 4/4" loading="lazy"><figcaption><span class="ok">Clase 6</span><b>Compases de 2/4, 3/4 y 4/4</b><span>El número de arriba dice cuántos tiempos tiene cada compás. El primer tiempo es el fuerte.</span></figcaption></figure>
  <figure><img src="img_tec/N1_cuerda2.svg" alt="SI, DO y RE en la 2.ª cuerda" loading="lazy"><figcaption><span class="ok">Clase 6</span><b>SI, DO y RE en la 2.ª cuerda</b><span>SI al aire (0), DO en el traste 1 con el dedo 1 y RE en el traste 3 con el dedo 3.</span></figcaption></figure>
  <figure><img src="img_tec/N1_ritmo_corcheas.svg" alt="Ritmo con corcheas" loading="lazy"><figcaption><span class="ok">Clase 7</span><b>Ritmo con corcheas</b><span>Dos corcheas unidas = un tiempo: «ti-ti».</span></figcaption></figure>
  <figure><img src="img_tec/N1_cuerdas_1y2.svg" alt="Lectura en la 1.ª y la 2.ª cuerda" loading="lazy"><figcaption><span class="ok">Clase 7</span><b>Lectura en la 1.ª y la 2.ª cuerda</b><span>Ahora se combinan las dos cuerdas. Mira la tablatura para saber en qué cuerda va cada nota.</span></figcaption></figure>
  <figure><img src="img_tec/N1_oda_alegria.svg" alt="Himno de la alegría" loading="lazy"><figcaption><span class="ok">Clase 8</span><b>Himno de la alegría</b><span>La primera melodía completa, solo con la 1.ª y la 2.ª cuerda.</span></figcaption></figure>
 </div>
 <h3 class="tmes">Mes 3</h3>
 <div class="tec">
  <figure><div class="par"><img src="img_tec/N1_acorde_Em.svg" alt="Acorde Em" loading="lazy"><img src="img_tec/N1_acorde_E.svg" alt="Acorde EM" loading="lazy"></div><figcaption><span class="ok">Clase 9</span><b>Em y EM</b><span>EM es Em más el dedo 1 en la 3.ª cuerda, traste 1. «Qué es un acorde» ya la explica la lámina G-12 de la sección 3.</span></figcaption></figure>
  <figure><img src="img_tec/N1_semitonos.svg" alt="Tonos y semitonos" loading="lazy"><figcaption><span class="ok">Clase 10</span><b>Tonos y semitonos</b><span>En la guitarra, 1 traste = 1 semitono y 2 trastes = 1 tono. En la escala de DO, entre MI–FA y entre SI–DO hay solo un semitono.</span></figcaption></figure>
  <figure><div class="par"><img src="img_tec/N1_acorde_Am.svg" alt="Acorde Am" loading="lazy"><img src="img_tec/N1_acorde_A.svg" alt="Acorde A" loading="lazy"></div><figcaption><span class="ok">Clase 10</span><b>Am y A</b><span>Las dos con la 6.ª cuerda sin tocar (✕). En A, los dedos 1, 2 y 3 van juntos en el traste 2.</span></figcaption></figure>
  <figure><img src="img_tec/N1_acorde_D.svg" alt="Acorde D" loading="lazy"><figcaption><span class="ok">Clase 11</span><b>D · Re mayor</b><span>Solo se tocan las 4 cuerdas de abajo: la 6.ª y la 5.ª no suenan.</span></figcaption></figure>
  <figure><img src="img_tec/N1_rasgueo.svg" alt="Rasgueos" loading="lazy"><figcaption><span class="ok">Clase 11</span><b>Rasgueos básicos</b><span>Abajo en el número y arriba en la «y». Hacia abajo suena más fuerte; hacia arriba, más suave.</span></figcaption></figure>
  <figure><img src="img_tec/N1_tablatura.svg" alt="Cómo leer la tablatura" loading="lazy"><figcaption><span class="ok">Clase 11</span><b>Cómo leer la tablatura</b><span>Cada línea es una cuerda (la de arriba es la 1.ª). El número dice qué traste pisar.</span></figcaption></figure>
  <figure><img src="img_tec/N1_escala_do.svg" alt="Escala de DO mayor" loading="lazy"><figcaption><span class="ok">Clase 11</span><b>Escala de DO mayor</b><span>Sube de DO a DO y vuelve a bajar, con la tablatura y el dedo de cada nota.</span></figcaption></figure>
  <figure><img src="img_tec/N1_acordes.svg" alt="Los 5 acordes del Nivel 1" loading="lazy"><figcaption><span class="ok">Clase 12</span><b>Los 5 acordes del Nivel 1</b><span>Em, E, Am, A y D para repasar todo junto.</span></figcaption></figure>
 </div>
 <h3 class="tmes">Nivel 2</h3>
 <div class="tec">
  <figure><img src="img_tec/G2_cromatica.svg" alt="La escala cromática" loading="lazy"><figcaption><span class="ok">Clase 13</span><b>La escala cromática</b><span>En la 1.ª cuerda cada traste sube un semitono. Las notas con ♯ o ♭ van en negro. Entre MI–FA y SI–DO no hay nota en medio.</span></figcaption></figure>
  <figure><img src="img_tec/G2_primera_posicion.svg" alt="Las notas de la primera posición" loading="lazy"><figcaption><span class="ok">Clase 14</span><b>Las notas de la primera posición</b><span>Trastes 0 a 3 en las seis cuerdas. Dedo 1 en el traste 1, dedo 2 en el 2 y dedo 3 en el 3. Los bordones son las cuerdas 4, 5 y 6.</span></figcaption></figure>
  <figure><img src="img_tec/G2_escala_sol.svg" alt="Escala de SOL mayor" loading="lazy"><figcaption><span class="ok">Clase 15</span><b>Escala de SOL mayor</b><span>De SOL grave (6.ª cuerda, traste 3) a SOL agudo (3.ª al aire). Los círculos dorados son los grados; d1, d2, d4, el dedo. Tiene un FA♯.</span></figcaption></figure>
  <figure><img src="img_tec/G2_acordes_mes4.svg" alt="Mis cinco acordes" loading="lazy"><figcaption><span class="ok">Clase 16</span><b>Mis cinco acordes</b><span>G, C, D, Em y Am con las notas que suenan en cada cuerda.</span></figcaption></figure>
  <figure><img src="img_tec/G2_rasgueos.svg" alt="Patrones de rasgueo" loading="lazy"><figcaption><span class="ok">Clase 17</span><b>Patrones de rasgueo</b><span>↓ abajo · ↑ arriba · la flecha dorada es el acento. En el vals, el pulgar toca el bajo en el 1 y se rasguea suave en el 2 y el 3.</span></figcaption></figure>
  <figure><img src="img_tec/G2_arpegio.svg" alt="El arpegio p, i, m, a" loading="lazy"><figcaption><span class="ok">Clase 18</span><b>El arpegio p, i, m, a</b><span>El pulgar toca el bajo y cada dedo tiene su cuerda aguda: i la 3.ª, m la 2.ª y a la 1.ª.</span></figcaption></figure>
  <figure><img src="img_tec/G2_escala_do.svg" alt="Escala de DO mayor con sus grados" loading="lazy"><figcaption><span class="ok">Clase 19</span><b>Escala de DO mayor con sus grados</b><span>Del DO de la 5.ª cuerda (traste 3) al DO de la 2.ª (traste 1). Los grados van en números romanos: I = DO, IV = FA, V = SOL… VIII vuelve a ser DO.</span></figcaption></figure>
  <figure><img src="img_tec/G2_lectura_sin_color.svg" alt="Lectura sin color · «Primer paseo»" loading="lazy"><figcaption><span class="ok">Clase 19</span><b>Lectura sin color · «Primer paseo»</b><span>Composición AMA. Escribe el nombre de cada nota en su cuadro y después tócala.</span></figcaption></figure>
  <figure><img src="img_tec/G2_acordes_tonalidad.svg" alt="Los acordes de la tonalidad de DO" loading="lazy"><figcaption><span class="ok">Clase 20</span><b>Los acordes de la tonalidad de DO</b><span>Sobre cada grado se forma un acorde: mayor (I, IV, V), menor (ii, iii, vi) o disminuido (vii°). En F, el dedo 1 pisa la 1.ª y la 2.ª: tu primera mini-cejilla.</span></figcaption></figure>
  <figure><img src="img_tec/G2_cejilla.svg" alt="La cejilla: F y Bm" loading="lazy"><figcaption><span class="ok">Clase 21</span><b>La cejilla: F y Bm</b><span>El dedo 1 pisa varias cuerdas a la vez. Pulgar detrás del mástil, el dedo 1 recto y pegado al traste. Revisa que cada cuerda suene limpia.</span></figcaption></figure>
  <figure><img src="img_tec/G2_septimas.svg" alt="Acordes de séptima" loading="lazy"><figcaption><span class="ok">Clase 22</span><b>Acordes de séptima</b><span>Al acorde mayor se le suma una cuarta nota, la séptima. Suenan con ganas de ir al acorde siguiente.</span></figcaption></figure>
  <figure><img src="img_tec/G2_dinamicas_forma.svg" alt="Toco con expresión" loading="lazy"><figcaption><span class="ok">Clase 23</span><b>Toco con expresión</b><span>Las dinámicas dicen qué tan fuerte o suave se toca; la forma, cómo se ordenan las partes (A estrofa, B coro).</span></figcaption></figure>
  <figure><img src="img_tec/G2_banda.svg" alt="Tocamos en banda" loading="lazy"><figcaption><span class="ok">Clase 24</span><b>Tocamos en banda</b><span>Cada instrumento tiene su tarea. Escucha a la batería, toca más suave si hay teclado y mira al líder para las entradas y el final.</span></figcaption></figure>
 </div>
</section>
