l="#E07A2E" stroke="#fbf7ef" stroke-width="2.5"/><text x="641.9" y="159" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#fff">♪</text><circle cx="266.9" cy="289" r="10" fill="#f2b93b"/><circle cx="454.4" cy="289" r="10" fill="#f2b93b"/><circle cx="641.9" cy="289" r="10" fill="#f2b93b"/><circle cx="829.4" cy="289" r="10" fill="#f2b93b"/><text x="500" y="360" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#b3aa98">Cuando el bajo y el bombo coinciden, la banda suena «pegada»</text><text x="500" y="394" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#b3aa98">El click marca el pulso: si me separo, vuelvo poco a poco</text><text x="30" y="474" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#f2b93b">Señales del director</text><rect x="20" y="500" width="310.7" height="200" rx="18" fill="#15110c" stroke="#4a3f2c" stroke-width="2.5"/><text x="175.3" y="566" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="48" font-weight="400" fill="#fbf7ef">✊</text><text x="175.3" y="616" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#f2b93b">Corte</text><text x="175.3" y="652" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#b3aa98">puño cerrado:</text><text x="175.3" y="680" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#b3aa98">todos paran juntos</text><rect x="344.7" y="500" width="310.7" height="200" rx="18" fill="#15110c" stroke="#4a3f2c" stroke-width="2.5"/><text x="500" y="566" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="48" font-weight="400" fill="#fbf7ef">🔁</text><text x="500" y="616" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#f2b93b">Repetir</text><text x="500" y="652" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#b3aa98">dedo que gira:</text><text x="500" y="680" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#b3aa98">otra vuelta</text><rect x="669.3" y="500" width="310.7" height="200" rx="18" fill="#15110c" stroke="#4a3f2c" stroke-width="2.5"/><text x="824.7" y="566" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="48" font-weight="400" fill="#fbf7ef">⬇</text><text x="824.7" y="616" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#f2b93b">Más suave</text><text x="824.7" y="652" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#b3aa98">palma hacia abajo</text><rect x="20" y="714" width="310.7" height="200" rx="18" fill="#15110c" stroke="#4a3f2c" stroke-width="2.5"/><text x="175.3" y="780" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="48" font-weight="400" fill="#fbf7ef">⬆</text><text x="175.3" y="830" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#f2b93b">Más fuerte</text><text x="175.3" y="866" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#b3aa98">palma hacia arriba</text><rect x="344.7" y="714" width="310.7" height="200" rx="18" fill="#15110c" stroke="#4a3f2c" stroke-width="2.5"/><text x="500" y="780" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="48" font-weight="400" fill="#fbf7ef">☝</text><text x="500" y="830" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#f2b93b">Al inicio</text><text x="500" y="866" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#b3aa98">señala arriba: vuelve</text><text x="500" y="894" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="20" font-weight="600" fill="#b3aa98">al principio</text><text x="500" y="948" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#b3aa98">Las señales pueden cambiar en cada banda: lo importante es acordarlas antes</text></svg>