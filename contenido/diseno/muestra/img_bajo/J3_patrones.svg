ont-family="Jost,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#b3aa98">15</text><line x1="966" y1="150" x2="966" y2="480" stroke="#a7a9ad" stroke-width="3"/><text x="936.8" y="516" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#b3aa98">16</text><rect x="92.5" y="166" width="226" height="140" rx="14" fill="#E5312B" opacity=".92"/><text x="205.5" y="230" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#fff">Patrón 1</text><text x="205.5" y="270" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#fff">2–5</text><rect x="209.5" y="320" width="226" height="140" rx="14" fill="#F57C00" opacity=".92"/><text x="322.5" y="384" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#fff">Patrón 2</text><text x="322.5" y="424" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#fff">4–7</text><rect x="385" y="166" width="226" height="140" rx="14" fill="#2E9E4F" opacity=".92"/><text x="498" y="230" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#fff">Patrón 3</text><text x="498" y="270" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#fff">7–10</text><rect x="502" y="320" width="226" height="140" rx="14" fill="#2F6FD8" opacity=".92"/><text x="615" y="384" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#fff">Patrón 4</text><text x="615" y="424" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#fff">9–12</text><rect x="677.5" y="166" width="226" height="140" rx="14" fill="#8E3BB8" opacity=".92"/><text x="790.5" y="230" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#fff">Patrón 5</text><text x="790.5" y="270" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#fff">12–15</text><text x="500" y="570" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#fbf7ef">Después del 5 vuelve el 1 (trastes 14 a 17).</text><text x="500" y="614" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#f2b93b">Para otra tonalidad, toda la cadena se mueve junta.</text></svg>