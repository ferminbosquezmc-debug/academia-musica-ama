<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="849" viewBox="0 0 1000 849" role="img" aria-label="Tonos y semitonos en el bajo y la cuerda SI"><title>Tonos y semitonos en el bajo y la cuerda SI</title><rect width="1000" height="849" rx="26" fill="#0b0907"/><text x="500" y="56" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-size="44" font-weight="700" fill="#fbf7ef">Un traste = un semitono</text><text x="500" y="100" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="30" font-weight="600" fill="#b3aa98">dos trastes = un tono</text><rect x="200" y="230" width="758" height="60" rx="8" fill="#2a1d12" opacity=".8"/><rect x="186" y="226" width="16" height="68" rx="4" fill="#f4ecd8"/><line x1="350" y1="230" x2="350" y2="290" stroke="#a7a9ad" stroke-width="6"/><text x="275" y="336" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#b3aa98">1</text><line x1="500" y1="230" x2="500" y2="290" stroke="#a7a9ad" stroke-width="6"/><text x="425" y="336" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#b3aa98">2</text><line x1="650" y1="230" x2="650" y2="290" stroke="#a7a9ad" stroke-width="6"/><text x="575" y="336" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#b3aa98">3</text><line x1="800" y1="230" x2="800" y2="290" stroke="#a7a9ad" stroke-width="6"/><text x="725" y="336" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#b3aa98">4</text><line x1="950" y1="230" x2="950" y2="290" stroke="#a7a9ad" stroke-width="6"/><text x="875" y="336" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#b3aa98">5</text><text x="138" y="336" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#b3aa98">aire</t