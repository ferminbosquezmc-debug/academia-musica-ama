<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-label="Técnica de slap: pulgar y pop"><title>Técnica de slap: pulgar y pop</title><rect width="1000" height="760" rx="26" fill="#0b0907"/><text x="500" y="58" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-size="44" font-weight="700" fill="#fbf7ef">Slap: pulgar y pop</text><rect x="30" y="110" width="940" height="104" rx="16" fill="#15110c" stroke="#2c241a" stroke-width="2"/><circle cx="90" cy="162" r="34" fill="#E5312B" stroke="#fbf7ef" stroke-width="3"/><text x="90" y="174.2" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="32.3" font-weight="700" fill="#fff">T</text><text x="150" y="154" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#f2b93b">Pulgar</text><text x="150" y="190" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#fbf7ef">golpeo con el hueso del pulgar al final del mástil y reboto</text><rect x="30" y="230" width="940" height="104" rx="16" fill="#15110c" stroke="#2c241a" stroke-width="2"/><circle cx="90" cy="282" r="34" fill="#2F6FD8" stroke="#fbf7ef" stroke-width="3"/><text x="90" y="294.2" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="32.3" font-weight="700" fill="#fff">P</text><text x="150" y="274" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#f2b93b">Pop</text><text x="150" y="310" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#fbf7ef">el índice engancha la cuerda RE o SOL, la jala y la suelta</text><rect x="30" y="350" width="940" height="104" rx="16" fill="#15110c" stroke="#2c241a" stroke-width="2"/><circle cx="90" cy="402" r="34" fill="#8a7f6e" stroke="#fbf7ef" stroke-width="3"/><text x="90" y="414.2" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="32.3" font-weight="700" fill="#fff">x</text><text x="150" y="394" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#f2b93b">Nota muerta</text><text x="150" y="430" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#fbf7ef">la mano izquierda apoya sin pisar: suena un golpe sin nota</text><text x="30" y="490" text-anchor="start" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#f2b93b">Octavas en MI: T en la raíz, P en la octava</text><text x="75" y="550" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#fbf7ef">1</text><circle cx="75" cy="610" r="40" fill="#E5312B" stroke="#fbf7ef" stroke-width="3"/><text x="75" y="624.4" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="38" font-weight="700" fill="#fff">T</text><text x="196" y="550" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#b3aa98">e</text><circle cx="196" cy="610" r="8" fill="#8a7f6e"/><text x="317" y="550" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#b3aa98">y</text><circle cx="317" cy="610" r="40" fill="#2F6FD8" stroke="#fbf7ef" stroke-width="3"/><text x="317" y="624.4" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="38" font-weight="700" fill="#fff">P</text><text x="438" y="550" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#b3aa98">a</text><circle cx="438" cy="610" r="8" fill="#8a7f6e"/><text x="559" y="550" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#fbf7ef">2</text><circle cx="559" cy="610" r="40" fill="#E5312B" stroke="#fbf7ef" stroke-width="3"/><text x="559" y="624.4" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="38" font-weight="700" fill="#fff">T</text><text x="680" y="550" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#b3aa98">e</text><circle cx="680" cy="610" r="40" fill="#E5312B" stroke="#fbf7ef" stroke-width="3"/><text x="680" y="624.4" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="38" font-weight="700" fill="#fff">T</text><text x="801" y="550" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#b3aa98">y</text><circle cx="801" cy="610" r="40" fill="#2F6FD8" stroke="#fbf7ef" stroke-width="3"/><text x="801" y="624.4" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="38" font-weight="700" fill="#fff">P</text><text x="922" y="550" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#b3aa98">a</text><circle cx="922" cy="610" r="8" fill="#8a7f6e"/><text x="500" y="690" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#fbf7ef">T: cuerda MI al aire · P: cuerda RE, traste 2 (MI una octava arriba)</text><text x="500" y="730" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#f2b93b">Empieza lento (60 BPM): el slap se aprende con precisión, no con fuerza.</text></svg>