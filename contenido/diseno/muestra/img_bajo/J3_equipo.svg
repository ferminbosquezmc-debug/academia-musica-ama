<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="910" viewBox="0 0 1000 910" role="img" aria-label="El camino del sonido del bajo"><title>El camino del sonido del bajo</title><rect width="1000" height="910" rx="26" fill="#0b0907"/><text x="500" y="58" text-anchor="middle" font-family="Cormorant Garamond,Georgia,serif" font-size="44" font-weight="700" fill="#fbf7ef">Mi equipo: el camino del sonido</text><text x="500" y="100" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="26" font-weight="600" fill="#b3aa98">Del bajo a la sala · reviso cada paso antes del ensayo</text><rect x="120" y="140" width="760" height="96" rx="18" fill="#f2b93b" stroke="#2c241a" stroke-width="2"/><text x="500" y="182" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#1b1206">Bajo</text><text x="500" y="218" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#1b1206">volumen arriba, tono a gusto</text><text x="500" y="264" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#b3aa98">↓</text><rect x="120" y="270" width="760" height="96" rx="18" fill="#15110c" stroke="#2c241a" stroke-width="2"/><text x="500" y="312" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#fbf7ef">Cable</text><text x="500" y="348" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#b3aa98">sin nudos, bien conectado</text><text x="500" y="394" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#b3aa98">↓</text><rect x="120" y="400" width="760" height="96" rx="18" fill="#15110c" stroke="#2c241a" stroke-width="2"/><text x="500" y="442" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#fbf7ef">Afinador</text><text x="500" y="478" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#b3aa98">afino antes de empezar</text><text x="500" y="524" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#b3aa98">↓</text><rect x="120" y="530" width="760" height="96" rx="18" fill="#15110c" stroke="#2c241a" stroke-width="2"/><text x="500" y="572" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#fbf7ef">Amplificador</text><text x="500" y="608" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#b3aa98">volumen moderado, graves sin exceso</text><text x="500" y="654" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#b3aa98">↓</text><rect x="120" y="660" width="760" height="96" rx="18" fill="#15110c" stroke="#2c241a" stroke-width="2"/><text x="500" y="702" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="32" font-weight="700" fill="#fbf7ef">Caja directa</text><text x="500" y="738" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#b3aa98">envía la señal a la consola</text><text x="500" y="800" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#fbf7ef">Encender: primero el bajo y los cables, al final el amplificador.</text><text x="500" y="836" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#fbf7ef">Apagar: primero el amplificador.</text><text x="500" y="880" text-anchor="middle" font-family="Jost,Segoe UI,Arial,sans-serif" font-size="24" font-weight="600" fill="#f2b93b">Cuida tu oído: tapones para músicos y volumen moderado.</text></svg>