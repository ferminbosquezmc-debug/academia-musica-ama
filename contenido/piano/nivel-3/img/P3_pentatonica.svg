<text x="1200" y="680" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#5F6368" text-anchor="middle" >Dorado = pentatónica · gris = las notas que se quitan (SI y FA)</text>
