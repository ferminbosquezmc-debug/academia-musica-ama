<text x="1830" y="905" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="600" fill="#1A1A1A" text-anchor="middle" >1 2 3 4</text>
<text x="1200" y="1060" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="600" fill="#5F6368" text-anchor="middle" >Si me equivoco, sigo: el público nota cuando nos detenemos, casi nunca el error.</text>
