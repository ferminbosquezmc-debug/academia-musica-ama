<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="900" viewBox="0 0 2400 900" role="img" aria-label="Dinámicas y forma A–B–A">
<title>Dinámicas y forma A–B–A</title>
<rect width="2400" height="900" fill="#FFFFFF"/>
<text x="40" y="72" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="48" font-weight="700" fill="#1A1A1A" text-anchor="start" >Dinámicas y forma</text>
<text x="40" y="124" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="500" fill="#5F6368" text-anchor="start" >La fuerza sale del peso del brazo · la forma es el mapa de la pieza</text>
<rect x="160" y="370" width="120" height="70" rx="10" fill="#C9A227" stroke="#1A1A1A" stroke-width="2" />
<text x="220" y="510" font-family="'DejaVu Serif', 'Times New Roman', serif" font-size="64" font-weight="700" fill="#1A1A1A" text-anchor="middle" font-style="italic">p</text>
<text x="220" y="555" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="22" font-weight="600" fill="#5F6368" text-anchor="middle" >piano · suave</text>
<rect x="460" y="300" width="120" height="140" rx="10" fill="#C9A227" stroke="#1A1A1A" stroke-width="2" />
<text x="520" y="510" font-family="'DejaVu Serif', 'Times New Roman', serif" font-size="64" font-weight="700" fill="#1A1A1A" text-anchor="middle" font-style="italic">mf</text>
<text x="520" y="555" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="22" font-weight="600" fill="#5F6368" text-anchor="middle" >mezzoforte · medio fuerte</text>
<rect x="760" y="230" width="120" height="210" rx="10" fill="#C9A227" stroke="#1A1A1A" stroke-width="2" />
<text x="820" y="510" font-family="'DejaVu Serif', 'Times New Roman', serif" font-size="64" font-weight="700" fill="#1A1A1A" text-anchor="middle" font-style="italic">f</text>
<text x="820" y="555" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="22" font-weight="600" fill="#5F6368" text-anchor="middle" >forte · fuerte</text>
<path d="M1150 330 L1550 270 M1150 330 L1550 390" fill="none" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"/>
<text x="1350" y="450" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="28" font-weight="700" fill="#1A1A1A" text-anchor="middle" >crescendo · cada vez más fuerte</text>
<path d="M1700 270 L2100 330 M1700 390 L2100 330" fill="none" stroke="#1A1A1A" stroke-width="6" stroke-linecap="round"/>
<text x="1900" y="450" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="28" font-weight="700" fill="#1A1A1A" text-anchor="middle" >diminuendo · cada vez más suave</text>
<rect x="160" y="640" width="620" height="180" rx="20" fill="#FBF1D3" stroke="#C9A227" stroke-width="3" />
<text x="230" y="760" font-family="'DejaVu Serif', 'Times New Roman', serif" font-size="90" font-weight="700" fill="#1A1A1A" text-anchor="middle" >A</text>
<text x="310" y="720" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="36" font-weight="700" fill="#1A1A1A" text-anchor="start" >Paso a paso</text>
<text x="310" y="775" font-family="'DejaVu Serif', 'Times New Roman', serif" font-size="34" font-weight="700" fill="#8A6A0A" text-anchor="start" font-style="italic">p</text>
