<path d="M870 730 L855.59 736.96 L855.59 723.04 Z" fill="#8A6A0A" stroke="none" stroke-width="0" />
<rect x="880" y="640" width="620" height="180" rx="20" fill="#F9D9D7" stroke="#C9A227" stroke-width="3" />
<text x="950" y="760" font-family="'DejaVu Serif', 'Times New Roman', serif" font-size="90" font-weight="700" fill="#1A1A1A" text-anchor="middle" >B</text>
<text x="1030" y="720" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="36" font-weight="700" fill="#1A1A1A" text-anchor="start" >Idea nueva</text>
<text x="1030" y="775" font-family="'DejaVu Serif', 'Times New Roman', serif" font-size="34" font-weight="700" fill="#8A6A0A" text-anchor="start" font-style="italic">f  (cresc.)</text>
<line x1="1510" y1="730" x2="1590" y2="730" stroke="#8A6A0A" stroke-width="5" stroke-linecap="round"/>
<path d="M1590 730 L1575.59 736.96 L1575.59 723.04 Z" fill="#8A6A0A" stroke="none" stroke-width="0" />
<rect x="1600" y="640" width="620" height="180" rx="20" fill="#FBF1D3" stroke="#C9A227" stroke-width="3" />
<text x="1670" y="760" font-family="'DejaVu Serif', 'Times New Roman', serif" font-size="90" font-weight="700" fill="#1A1A1A" text-anchor="middle" >A</text>
<text x="1750" y="720" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="36" font-weight="700" fill="#1A1A1A" text-anchor="start" >Vuelve el comienzo</text>
<text x="1750" y="775" font-family="'DejaVu Serif', 'Times New Roman', serif" font-size="34" font-weight="700" fill="#8A6A0A" text-anchor="start" font-style="italic">mf → dim.</text>
