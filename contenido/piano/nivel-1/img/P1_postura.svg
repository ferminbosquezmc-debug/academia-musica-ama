<text x="1250" y="754" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1A1A" text-anchor="start" >Antebrazos a la altura del teclado</text>
<text x="1250" y="796" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#5F6368" text-anchor="start" >si el banco no se ajusta, un cojín firme</text>
<circle cx="1200" cy="875" r="30" fill="#C9A227" stroke="#1A1A1A" stroke-width="2.5"/>
<text x="1200" y="886.4" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="33" font-weight="700" fill="#1A1A1A" text-anchor="middle" >6</text>
<text x="1250" y="879" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1A1A" text-anchor="start" >Muñeca recta</text>
<text x="1250" y="921" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#5F6368" text-anchor="start" >en línea con el antebrazo: ni caída ni levantada</text>
<circle cx="1200" cy="1000" r="30" fill="#C9A227" stroke="#1A1A1A" stroke-width="2.5"/>
<text x="1200" y="1011.4" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="33" font-weight="700" fill="#1A1A1A" text-anchor="middle" >7</text>
<text x="1250" y="1004" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1A1A" text-anchor="start" >Mano redonda</text>
<text x="1250" y="1046" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#5F6368" text-anchor="start" >como si sostuviera una burbuja; toco con la yema</text>
