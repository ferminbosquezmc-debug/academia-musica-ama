<text x="1250" y="421" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#5F6368" text-anchor="start" >sentado, sin apoyarse en el respaldo</text>
<circle cx="1200" cy="500" r="30" fill="#C9A227" stroke="#1A1A1A" stroke-width="2.5"/>
