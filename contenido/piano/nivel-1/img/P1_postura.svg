<text x="1250" y="254" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="38" font-weight="700" fill="#1A1A1A" text-anchor="start" >Banco frente al DO central</text>
<text x="1250" y="296" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#5F6368" text-anchor="start" >a una distancia en la que los brazos quedan un poco doblados</text>
<circle cx="1200" cy="375" r="30" fill="#C9A227" stroke="#1A1A1A" stroke-width="2.5"/>
<text x="1200" y="386.4" font-family="Poppins, Montserrat, 'Trebuchet MS', Arial, sans-serif" font-size="33" font-weight="700" fill="#1A1A1A" text-anchor="middle" >2</text>
