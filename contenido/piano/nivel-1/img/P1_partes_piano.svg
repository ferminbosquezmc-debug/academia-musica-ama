<text x="1530" y="1046" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#5F6368" text-anchor="start" >el derecho sostiene el sonido</text>
<text x="40" y="1150" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#5F6368" text-anchor="start" >Pedal derecho = de resonancia: mantiene el sonido al soltar las teclas. En el Nivel 1 no se usa.</text>
<text x="40" y="1200" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="500" fill="#5F6368" text-anchor="start" >Piano digital: además tiene botón de encendido, volumen y entrada de audífonos.</text>
